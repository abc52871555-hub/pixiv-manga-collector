name: Feature request
description: 提议一个功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你遇到了什么问题？为什么现有功能不够？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选
  - type: checkboxes
    id: scope
    attributes:
      label: 范围
      options:
        - label: 我已确认不涉及绕过登录、传播受版权保护内容或违反 Pixiv 条款
          required: true
