name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile server.py metadata_inspect.py token_login.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax
        run: node --check web/app.js
